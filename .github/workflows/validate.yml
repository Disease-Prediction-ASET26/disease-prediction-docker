name: Validate Compose
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: compose-validation-only
      DATA_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate all Compose profiles
      run: docker compose --profile '*' config --quiet
